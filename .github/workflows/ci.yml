name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Publish dry-run (pack)
        if: matrix.node == 22
        run: pnpm pack --dry-run

      - name: Self check (no telemetry deps expected)
        if: matrix.node == 22
        run: node dist/cli.mjs check --json=compact

      - name: list / why smoke
        if: matrix.node == 22
        run: |
          node dist/cli.mjs list --json=compact | head -c 200
          echo
          node dist/cli.mjs why next --json=compact

  # Optional: temp project with next+turbo must init → check green
  fixture-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install & build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Fixture init + check
        run: |
          FIX=$(mktemp -d)
          printf '%s\n' '{"name":"fixture","private":true,"dependencies":{"next":"15","turbo":"2"}}' > "$FIX/package.json"
          (cd "$FIX" && node "$GITHUB_WORKSPACE/dist/cli.mjs" init -y)
          (cd "$FIX" && node "$GITHUB_WORKSPACE/dist/cli.mjs" check --json=compact)
          test -f "$FIX/.env"
          grep -q 'NEXT_TELEMETRY_DISABLED=1' "$FIX/.env"
          grep -q 'TURBO_TELEMETRY_DISABLED=1' "$FIX/.env"
          grep -q 'DO_NOT_TRACK=1' "$FIX/.env"
