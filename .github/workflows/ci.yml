name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Self check (no telemetry deps expected)
        run: node dist/cli.mjs check --json=compact

      - name: list / why smoke
        run: |
          node dist/cli.mjs list --json=compact | head -c 200
          echo
          node dist/cli.mjs why next --json=compact

      - name: Publish dry-run
        env:
          PNPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: pnpm pack --dry-run

      - name: Build package artifact
        env:
          PNPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts

      - name: Packed package acceptance
        run: |
          TARBALL=$(find .artifacts -name '*.tgz' -type f -print -quit)
          pnpm run test:package -- "$TARBALL" --tsc node_modules/.bin/tsc

      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: .artifacts/*.tgz
          if-no-files-found: error

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: .artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Packed runtime smoke
        run: |
          TARBALL=$(find .artifacts -name '*.tgz' -type f -print -quit)
          node scripts/package-smoke.mjs "$TARBALL"
